<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" rx="16" fill="#F0EEFA"/>
  <!-- Spiral Notebook / Planner Mockup -->
  <g transform="translate(60, 30)">
    <!-- Shadow -->
    <rect x="5" y="10" width="270" height="225" rx="8" fill="#7060F5" fill-opacity="0.08"/>
    <!-- Notebook body -->
    <rect x="0" y="0" width="280" height="240" rx="8" fill="#FFFFFF" stroke="#E4E0F4" stroke-width="1.5"/>
    <!-- Header bar -->
    <rect x="25" y="24" width="120" height="12" rx="6" fill="#22212B"/>
    <rect x="25" y="44" width="80" height="6" rx="3" fill="#B8A7FF"/>
    
    <!-- Table Grid Mockup -->
    <rect x="25" y="65" width="230" height="28" rx="4" fill="#F9F8FF" stroke="#E9E5FF"/>
    <circle cx="40" cy="79" r="6" fill="#7060F5" fill-opacity="0.2"/>
    <rect x="55" y="76" width="100" height="6" rx="3" fill="#777486"/>
    
    <rect x="25" y="100" width="230" height="28" rx="4" fill="#FFFFFF" stroke="#E9E5FF"/>
    <circle cx="40" cy="114" r="6" fill="#7060F5"/>
    <rect x="55" y="111" width="130" height="6" rx="3" fill="#22212B"/>

    <rect x="25" y="135" width="230" height="28" rx="4" fill="#FFFFFF" stroke="#E9E5FF"/>
    <circle cx="40" cy="149" r="6" fill="#7060F5" fill-opacity="0.2"/>
    <rect x="55" y="146" width="90" height="6" rx="3" fill="#777486"/>

    <rect x="25" y="170" width="230" height="28" rx="4" fill="#F9F8FF" stroke="#E9E5FF"/>
    <circle cx="40" cy="184" r="6" fill="#7060F5"/>
    <rect x="55" y="181" width="115" height="6" rx="3" fill="#22212B"/>

    <!-- Spiral ring holes on left -->
    <rect x="-8" y="30" width="16" height="6" rx="3" fill="#D4CDFF" stroke="#7060F5" stroke-width="1"/>
    <rect x="-8" y="60" width="16" height="6" rx="3" fill="#D4CDFF" stroke="#7060F5" stroke-width="1"/>
    <rect x="-8" y="90" width="16" height="6" rx="3" fill="#D4CDFF" stroke="#7060F5" stroke-width="1"/>
    <rect x="-8" y="120" width="16" height="6" rx="3" fill="#D4CDFF" stroke="#7060F5" stroke-width="1"/>
    <rect x="-8" y="150" width="16" height="6" rx="3" fill="#D4CDFF" stroke="#7060F5" stroke-width="1"/>
    <rect x="-8" y="180" width="16" height="6" rx="3" fill="#D4CDFF" stroke="#7060F5" stroke-width="1"/>
    <rect x="-8" y="210" width="16" height="6" rx="3" fill="#D4CDFF" stroke="#7060F5" stroke-width="1"/>
  </g>
</svg>
